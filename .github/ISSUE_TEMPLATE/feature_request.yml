name: Feature request
description: Suggest an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        One thing worth knowing before you write: forecasts, air quality, and
        astronomical data all come from Open-Meteo, and warnings come from each
        country's own weather service. A request that needs data none of them
        publish is unlikely to land, but it's still worth logging so it's tracked.
        That's the honest scope rather than a "no".
  - type: checkboxes
    attributes:
      label: Before you start
      options:
        - label: I have searched the existing issues and discussions for this
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What are you trying to do that you can't do today?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: How you imagine it working, if you have a shape in mind.
  - type: textarea
    id: workaround
    attributes:
      label: Existing workaround, if any
